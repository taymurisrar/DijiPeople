appId: com.dijipeople.agent
productName: DijiPeople Agent
artifactName: DijiPeople-Agent-Setup-${version}.${ext}

directories:
  output: release

files:
  - dist/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: .env
    to: .env

win:
  icon: assets/icon.ico
  target:
    - nsis
  signExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

publish:
  provider: generic
  url: "${env.DIJIPEOPLE_AGENT_UPDATE_URL}"