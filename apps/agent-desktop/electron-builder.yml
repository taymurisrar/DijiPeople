appId: com.dijipeople.agent
productName: DijiPeople Agent
artifactName: DijiPeople-Agent-Setup-${version}.${ext}

directories:
  output: release

files:
  - dist/**/*
  - assets/**/*
  - package.json

  # Native-build tooling must not ship to customers.
  #
  # `active-win` declares @mapbox/node-pre-gyp, node-gyp and node-addon-api as
  # optionalDependencies. They exist to *compile* the native addon at install
  # time. electron-builder includes production dependencies regardless of the
  # patterns above, so all of them were being packaged — BUG-0052 recorded the
  # opposite ("does not ship in the packaged app"), and a build of 2026-08-20 was
  # found to contain node-gyp@9.4.1, cacache@16.1.3, make-fetch-happen@10.2.1 and
  # tar@6.2.1, every one of them at its advisory version.
  #
  # Only @mapbox/node-pre-gyp is required at run time: active-win's
  # lib/windows-binding.js calls binary.find() to locate the compiled addon, and
  # Windows is the only platform this app targets. node-gyp is never required by
  # anything active-win loads — verified by searching its index and lib for a
  # node-gyp reference and finding none.
  #
  # tar ships and is required. BUG-0052's 2026-08-22 upgrade moved
  # @mapbox/node-pre-gyp to 2.0.3, whose own nested tar (7.5.22, outside the
  # advisory range) is what binary.find() actually loads at runtime. It is not
  # excluded.
  #
  # node-gyp is build-only and excluded wholesale below. Under the old
  # node-pre-gyp@1 / node-gyp@9 pairing, its chain (cacache, make-fetch-happen,
  # @npmcli/*, @gar/*, @tootallnate/*, socks-proxy-agent, ssri, unique-filename,
  # unique-slug, infer-owner, minipass-fetch/collect/flush/pipeline/sized) had to
  # be listed one package at a time because some of it was hoisted to the top
  # level. Under node-gyp@11.5.0 (this upgrade) every one of those now nests
  # entirely inside node_modules/node-gyp/node_modules/, and @gar, @tootallnate
  # and infer-owner are gone from the tree altogether — so
  # `!node_modules/node-gyp/**` alone already removes all of it. The individual
  # entries were verified to match nothing at the top level (ITEM-0077,
  # 2026-09-11) and were removed rather than kept as decoration; re-check with a
  # literal path search if node-gyp's dependency graph changes again.
  #
  # npmlog, gauge and are-we-there-yet were the historical trap: they look like
  # build tooling and arrived under the old node-gyp, but node-pre-gyp@1 declared
  # npmlog as a hard dependency, so excluding it made
  # `require('@mapbox/node-pre-gyp')` throw and the agent never found its addon.
  # A dependency-closure walk over the packaged archive caught it before the
  # build shipped. node-pre-gyp@2 no longer depends on npmlog at all (it uses
  # consola), so that specific trap is gone, but the lesson — exclude by
  # verified closure, not by category — is why promise-retry/retry below were
  # kept rather than dropped along with the rest.
  #
  # promise-retry and retry are still hoisted to the top level (they are a
  # dependency of electron-builder's own @electron/notarize) and are not part of
  # node-pre-gyp@2's runtime closure — confirmed absent from the extracted
  # app.asar (ITEM-0077, 2026-09-11).
  - "!node_modules/node-gyp/**"
  - "!node_modules/promise-retry/**"
  - "!node_modules/retry/**"

extraResources:
  - from: .env
    to: .env

win:
  icon: assets/icon.ico
  target:
    - nsis
  # Code signing is a DROP-IN (TASK-0025, ITEM-0026). electron-builder signs the
  # installer automatically when the CSC_LINK (base64 or path to the .pfx/.p12
  # certificate) and CSC_KEY_PASSWORD environment variables are present, and
  # silently builds unsigned when they are not. So today's build is unsigned
  # (SmartScreen shows an "unknown publisher" warning and electron-updater cannot
  # verify the publisher); the moment an OV/EV certificate is added as those two
  # CI secrets, every subsequent build is signed with no code change here. The
  # release workflows already pass CSC_LINK / CSC_KEY_PASSWORD through.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

publish:
  provider: generic
  url: "${env.DIJIPEOPLE_AGENT_UPDATE_URL}"