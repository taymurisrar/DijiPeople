appId: com.dijipeople.agent
productName: DijiPeople Agent
artifactName: DijiPeople-Agent-Setup-${version}.${ext}

directories:
  output: release

files:
  - dist/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: .env
    to: .env

win:
  # A real .ico is supplied so electron-builder does not convert the PNG at
  # build time; that conversion runs in WebAssembly and fails outright on a
  # memory-pressured machine ("WebAssembly.Memory(): could not allocate memory").
  icon: assets/favicon.ico
  target:
    - nsis
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  url: "${env.DIJIPEOPLE_AGENT_UPDATE_URL}"