<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7fbf9" />
  <title>DijiPeople Agent</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --page: #f7fbf9;
      --surface: #ffffff;
      --surface-soft: #f4f8f6;
      --border: #dfe9e4;
      --border-strong: #b8d8cb;
      --text: #17221d;
      --muted: #718078;
      --placeholder: #9aa8a1;
      --brand: #079669;
      --brand-hover: #067b58;
      --brand-soft: #e9f8f2;
      --brand-ring: rgba(7, 150, 105, 0.14);
      --success: #0f9f6e;
      --danger: #c23d4b;
      --danger-bg: #fff4f5;
      --danger-border: #f2c9ce;
      --radius: 16px;
      --control-radius: 11px;
      --shadow: 0 18px 50px rgba(33, 64, 50, 0.08);
    }

    html,
    body {
      width: 100%;
      min-width: 280px;
      min-height: 100%;
      margin: 0;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(66, 203, 154, 0.11), transparent 34%),
        var(--page);
    }

    main {
      width: min(420px, 100%);
    }

    .card {
      width: 100%;
      max-height: calc(100dvh - 28px);
      overflow-y: auto;
      padding: clamp(20px, 4vw, 28px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      scrollbar-width: thin;
      scrollbar-color: #cbd8d1 transparent;
    }

    .card::-webkit-scrollbar { width: 5px; }
    .card::-webkit-scrollbar-thumb {
      border-radius: 99px;
      background: #cbd8d1;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 22px;
    }

    .agent-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid #cae9dc;
      border-radius: 999px;
      background: #f0faf6;
      color: #287a5d;
      font-size: 11px;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(15, 159, 110, 0.10);
    }

    .brand {
      margin-bottom: 24px;
      text-align: center;
    }

    .brand-icon {
      display: block;
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 8px 22px rgba(7, 150, 105, 0.12);
    }

    h1 {
      margin: 0;
      color: #18241f;
      font-size: clamp(23px, 5vw, 28px);
      font-weight: 750;
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 33ch;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }

    .alert {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid var(--danger-border);
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .alert.visible { display: block; }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      margin-bottom: 6px;
      color: #4b5d54;
      font-size: 12px;
      font-weight: 650;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      outline: none;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      line-height: 1.2;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input::placeholder { color: var(--placeholder); }

    input:hover { border-color: #cadbd3; }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-ring);
      background: #fff;
    }

    .password-input { padding-right: 66px; }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      min-width: 48px;
      min-height: 30px;
      padding: 0 6px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--brand);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .toggle-password:hover { background: var(--brand-soft); }

    .toggle-password:focus-visible {
      outline: 2px solid rgba(7, 150, 105, 0.30);
      outline-offset: 1px;
    }

    .field-error {
      min-height: 13px;
      margin-top: 4px;
      color: var(--danger);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .submit {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border: 0;
      border-radius: var(--control-radius);
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.2;
      box-shadow: 0 8px 18px rgba(7, 150, 105, 0.16);
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .submit:hover:not(:disabled) {
      background: var(--brand-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(7, 150, 105, 0.20);
    }

    .submit:focus-visible {
      outline: 3px solid var(--brand-ring);
      outline-offset: 2px;
    }

    .submit:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status {
      min-height: 16px;
      margin-top: 10px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .trust-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
      padding: 11px 12px;
      border: 1px solid #e1eee8;
      border-radius: 11px;
      background: var(--surface-soft);
    }

    .trust-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--brand-soft);
      color: var(--brand);
    }

    .trust-icon svg {
      width: 15px;
      height: 15px;
    }

    .trust-title {
      margin-bottom: 2px;
      color: #384a41;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.3;
    }

    .trust-text {
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.45;
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      color: #99a69f;
      font-size: 10px;
      line-height: 1.4;
    }

    .footer strong {
      color: #63736b;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      body {
        place-items: start center;
        padding: 10px;
      }

      main { width: 100%; }

      .card {
        max-height: calc(100dvh - 20px);
        padding: 18px;
        border-radius: 14px;
      }

      .top-bar { margin-bottom: 18px; }
      .brand { margin-bottom: 20px; }
      .brand-icon { width: 56px; height: 56px; }
    }

    @media (max-height: 650px) {
      body { place-items: start center; }
      .card { padding: 16px 18px; }
      .top-bar { margin-bottom: 14px; }
      .brand { margin-bottom: 16px; }
      .brand-icon { width: 48px; height: 48px; margin-bottom: 10px; border-radius: 13px; }
      h1 { font-size: 22px; }
      .subtitle { margin-top: 6px; }
      .field { margin-bottom: 10px; }
      input, .submit { min-height: 42px; }
      .trust-box { margin-top: 12px; }
      .footer { margin-top: 10px; }
    }

    @media (max-height: 560px) {
      .subtitle,
      .trust-box { display: none; }
      .brand { margin-bottom: 14px; }
    }

    @media (max-height: 490px) {
      .footer { display: none; }
      .top-bar { margin-bottom: 10px; }
      .brand-icon { width: 42px; height: 42px; margin-bottom: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .submit:hover:not(:disabled) { transform: none; }
    }
  </style>
</head>

        <h1 id="agent-heading">DijiPeople Agent</h1>
        <div class="subtitle">
          Sign in with your work account to connect this device.
        </div>
      </div>

      <div id="error-banner" class="alert" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate action="#">
        <div class="field">
          <label for="email">Work Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@company.com"
            required
          />
          <div id="email-error" class="field-error" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              id="password"
              class="password-input"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
            <button
              id="toggle-password"
              class="toggle-password"
              type="button"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
          <div id="password-error" class="field-error" aria-live="polite"></div>
        </div>

        <button id="submit" class="submit" type="submit">
          Sign in to Agent
        </button>

        <div id="status" class="status" aria-live="polite"></div>

        <div class="trust-box">
          <div class="trust-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <div>
            <div class="trust-title">Secure device connection</div>
            <div class="trust-text">
              This device will connect securely to your organization for attendance and agent synchronization.
            </div>
          </div>
        </div>

        <div class="footer">
          Powered by <strong>DijiPeople</strong>
        </div>
      </form>
    </section>
  </main>

  <script>
    window.addEventListener("submit", function (event) {
      if (event.target && event.target.id === "login-form") {
        event.preventDefault();
      }
    });
  </script>
