<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>DijiPeople Agent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #081120;
      --card: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);

      --text: #f8fafc;
      --muted: #94a3b8;

      --primary: #2563eb;
      --primary-hover: #1d4ed8;

      --success: #22c55e;
      --danger: #ef4444;

      --shadow:
        0 8px 28px rgba(0, 0, 0, 0.34),
        0 0 60px rgba(37, 99, 235, 0.10);

      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.08);

      --radius: 18px;
    }

    html {
      width: 100%;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.30), transparent 28%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.20), transparent 32%),
        linear-gradient(135deg, #020617 0%, #081120 40%, #0f172a 100%);
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      opacity: 0.05;
      pointer-events: none;

      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);

      background-size: 32px 32px;
    }

    main {
      position: relative;
      z-index: 2;
      width: min(420px, 100%);
    }

    .card {
      position: relative;
      width: 100%;

      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);

      padding: clamp(18px, 4vw, 24px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 16px;
    }

    .agent-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      max-width: 100%;

      padding: 6px 10px;
      border-radius: 999px;

      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.20);

      font-size: 11px;
      line-height: 1;
      color: #bbf7d0;

      white-space: nowrap;
    }

    .status-dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 12px var(--success);
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo {
      width: clamp(50px, 14vw, 58px);
      height: clamp(50px, 14vw, 58px);

      margin: 0 auto 12px;

      border-radius: 16px;

      background:
        linear-gradient(135deg, #2563eb 0%, #1d4ed8 40%, #0ea5e9 100%);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(19px, 5vw, 22px);
      font-weight: 800;

      box-shadow:
        0 10px 24px rgba(37, 99, 235, 0.30),
        inset 0 1px 1px rgba(255,255,255,0.15);
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 26px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.45;
      font-size: clamp(12px, 3.4vw, 13px);
    }

    .alert {
      display: none;

      margin-bottom: 12px;
      padding: 10px 12px;

      border-radius: 12px;

      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.18);

      color: #fecaca;

      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .alert.visible {
      display: block;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;

      font-size: 12px;
      font-weight: 600;

      color: #cbd5e1;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 42px;

      padding: 11px 13px;

      border-radius: 12px;
      border: 1px solid var(--input-border);

      background: var(--input-bg);
      color: white;

      font-size: 15px;
      line-height: 1.2;

      outline: none;

      transition: all 160ms ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: rgba(37, 99, 235, 0.65);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .password-input {
      padding-right: 72px;
    }

    .toggle-password {
      position: absolute;

      top: 50%;
      right: 8px;

      transform: translateY(-50%);

      min-width: 46px;
      min-height: 28px;

      border: 0;
      border-radius: 9px;

      background: transparent;

      color: #60a5fa;

      cursor: pointer;

      font-weight: 700;
      font-size: 11px;
      line-height: 1;
    }

    .toggle-password:focus-visible {
      outline: 2px solid rgba(96, 165, 250, 0.8);
      outline-offset: 2px;
    }

    .field-error {
      min-height: 14px;
      margin-top: 4px;

      font-size: 11px;
      line-height: 1.35;

      color: #fca5a5;
      overflow-wrap: anywhere;
    }

    .submit {
      width: 100%;
      min-height: 44px;

      border: 0;

      padding: 12px 16px;

      border-radius: 12px;

      background:
        linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);

      color: white;

      font-size: 13px;
      font-weight: 750;

      cursor: pointer;

      transition: all 180ms ease;

      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.30);
    }

    .submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.38);
    }

    .submit:focus-visible {
      outline: 2px solid rgba(96, 165, 250, 0.8);
      outline-offset: 3px;
    }

    .submit:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      margin-top: 10px;
      min-height: 15px;

      text-align: center;

      font-size: 11px;
      line-height: 1.4;

      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .trust-box {
      margin-top: 14px;

      border-radius: 13px;

      padding: 12px;

      background: rgba(255,255,255,0.03);

      border: 1px solid rgba(255,255,255,0.06);
    }

    .trust-title {
      margin-bottom: 5px;

      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }

    .trust-text {
      color: var(--muted);

      font-size: 11px;
      line-height: 1.45;
    }

    .footer {
      margin-top: 14px;

      text-align: center;

      color: #64748b;

      font-size: 10px;
      line-height: 1.4;
    }

    .footer strong {
      color: #cbd5e1;
    }

    @media (max-width: 420px) {
      body {
        align-items: flex-start;
        padding: 12px;
      }

      .card {
        border-radius: 16px;
        padding: 16px;
      }

      .top-bar {
        margin-bottom: 14px;
      }

      .brand {
        margin-bottom: 16px;
      }

      .subtitle {
        max-width: 30ch;
        margin-left: auto;
        margin-right: auto;
      }

      .trust-box {
        margin-top: 12px;
        padding: 11px;
      }
    }

    @media (max-width: 340px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 14px;
      }

      .password-input {
        padding-right: 66px;
      }

      .toggle-password {
        right: 6px;
        min-width: 44px;
      }
    }

    @media (max-height: 680px) {
      body {
        align-items: flex-start;
      }

      .logo {
        margin-bottom: 10px;
      }

      .brand,
      .top-bar {
        margin-bottom: 12px;
      }

      .field {
        margin-bottom: 10px;
      }

      .trust-box {
        margin-top: 12px;
      }

      .footer {
        margin-top: 10px;
      }
    }

    @media (max-height: 560px) {
      .trust-box {
        display: none;
      }

      .footer {
        margin-top: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .submit:hover:not(:disabled) {
        transform: none;
      }
    }


    /* Compact professional responsive layout */
    :root {
      --radius: 16px;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      align-items: center;
      padding: clamp(10px, 2.2vh, 16px);
    }

    main {
      width: min(390px, calc(100vw - 20px));
    }

    .card {
      max-height: calc(100dvh - 20px);
      overflow-y: auto;
      scrollbar-width: thin;
      padding: clamp(16px, 2.6vh, 22px);
    }

    .top-bar {
      margin-bottom: clamp(10px, 1.8vh, 14px);
    }

    .agent-status {
      padding: 6px 10px;
      font-size: 11px;
    }

    .brand {
      margin-bottom: clamp(14px, 2.4vh, 18px);
    }

    .logo {
      width: clamp(48px, 10vh, 58px);
      height: clamp(48px, 10vh, 58px);
      margin-bottom: clamp(8px, 1.6vh, 12px);
      border-radius: 15px;
    }

    h1 {
      font-size: clamp(22px, 4.2vh, 26px);
    }

    .subtitle {
      max-width: 34ch;
      margin: 7px auto 0;
      font-size: clamp(12px, 2vh, 13px);
      line-height: 1.45;
    }

    .field {
      margin-bottom: clamp(8px, 1.7vh, 12px);
    }

    label {
      margin-bottom: 5px;
      font-size: 12px;
    }

    input {
      min-height: clamp(38px, 6.4vh, 44px);
      padding: 10px 13px;
      font-size: 14px;
      border-radius: 12px;
    }

    .submit {
      min-height: clamp(40px, 6.5vh, 44px);
      padding: 11px 16px;
      font-size: 13px;
      border-radius: 12px;
    }

    .field-error {
      min-height: 12px;
      margin-top: 3px;
    }

    .status {
      margin-top: 8px;
      min-height: 14px;
    }

    .trust-box {
      margin-top: clamp(10px, 1.8vh, 14px);
      padding: 10px 12px;
      border-radius: 12px;
    }

    .trust-title {
      margin-bottom: 4px;
      font-size: 11px;
    }

    .trust-text {
      font-size: 10.5px;
      line-height: 1.4;
    }

    .footer {
      margin-top: 10px;
      font-size: 10px;
    }

    @media (max-height: 640px) {
      body {
        align-items: flex-start;
      }

      .card {
        padding: 14px;
      }

      .logo {
        width: 46px;
        height: 46px;
        font-size: 18px;
      }

      h1 {
        font-size: 22px;
      }

      .subtitle {
        font-size: 12px;
      }

      .trust-box {
        display: none;
      }
    }

    @media (max-height: 520px) {
      .subtitle,
      .footer {
        display: none;
      }

      .brand {
        margin-bottom: 10px;
      }
    }

  </style>
</head>

<body>

  <div class="bg-grid"></div>

  <main>
    <section class="card">

      <div class="top-bar">
        <div class="agent-status">
          <div class="status-dot"></div>
          Secure Agent
        </div>
      </div>

      <div class="brand">
        <div class="logo">DP</div>

        <h1>DijiPeople Agent</h1>

        <div class="subtitle">
          Secure workforce tracking and productivity synchronization for enterprise teams.
        </div>
      </div>

      <div id="error-banner" class="alert"></div>

      <form id="login-form" novalidate action="#">

        <div class="field">
          <label for="email">Work Email</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="john@company.com"
            required
          />

          <div id="email-error" class="field-error"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="input-wrap">
            <input
              id="password"
              class="password-input"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />

            <button
              id="toggle-password"
              class="toggle-password"
              type="button">
              Show
            </button>
          </div>

          <div id="password-error" class="field-error"></div>
        </div>

        <button id="submit" class="submit" type="submit">
          Sign in to Agent
        </button>

        <div id="status" class="status"></div>

        <div class="trust-box">
          <div class="trust-title">
            Trusted Enterprise Device
          </div>

          <div class="trust-text">
            This workstation will securely register with your organization and synchronize attendance, activity, and session telemetry.
          </div>
        </div>

        <div class="footer">
          Powered by <strong>DijiPeople</strong>
        </div>

      </form>
    </section>
  </main>

  <script>
    window.addEventListener("submit", function (event) {
      if (event.target && event.target.id === "login-form") {
        event.preventDefault();
      }
    });
  </script>

  <script defer src="./login.js"></script>

</body>

</html>
