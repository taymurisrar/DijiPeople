services:
  - type: web
    name: dijipeople-api
    env: node
    plan: starter
    # BUG-0767 — THIS FILE WAS NOT WHAT PRODUCTION RAN.
    #
    # Until 2026-08-23 the live service was configured by hand in the Render
    # dashboard: no preDeployCommand at all, and `npx prisma migrate deploy`
    # bolted onto the end of buildCommand instead. Migrations therefore applied
    # and deploys looked correct, which is exactly why nobody noticed that
    # seed:config, seed:verify, seed:admin, seed:legal and legal:publish had
    # *never executed on production*.
    #
    # The consequence was not theoretical. No purchase could record consent,
    # because the subscribe wizard requires agreements carrying a published
    # version and none was ever published.
    #
    # If you change these values, change them HERE and apply the file. A
    # dashboard edit that diverges from this file is invisible to every review.
    buildCommand: npm ci && npm --workspace api run build
    startCommand: npm --workspace api run start:prod

    # Runs after the build, before the new instance takes traffic. A non-zero
    # exit ABORTS THE DEPLOY and leaves the previous instance serving, which is
    # the point: a half-seeded deployment is worse than a deferred one.
    #
    # `release` is migrate -> seed:config -> seed:verify -> seed:admin ->
    # seed:legal -> legal:publish --confirm. Every step is idempotent, so a
    # retried deploy is safe.
    #
    # On legal:publish specifically — it refuses any document whose own text
    # declares it a draft (findDraftSelfDeclarations). That guard exists because
    # on 2026-08-22 ten documents were published carrying a banner reading
    # "Draft — not published, and not legal advice … has not been reviewed by a
    # lawyer". Automating publication without it would have repeated that on
    # every deploy instead of once.
    preDeployCommand: npm --workspace api run release
    healthCheckPath: /api

    # Durable file storage (TASK-0025). StorageService writes uploaded files —
    # tenant documents, branding assets, and published app-release installers —
    # under FILE_STORAGE_DIR. Without a persistent disk that path is on the
    # instance's ephemeral filesystem and every deploy wipes it, so a published
    # agent installer (or any uploaded document) vanishes on the next deploy.
    # This disk gives those bytes a durable home.
    #
    # TRADEOFF: a Render disk pins this service to a SINGLE INSTANCE — it cannot
    # be attached to a horizontally scaled service. `starter` runs one instance,
    # so this is free today; if the API ever needs to scale out, file storage
    # must move to object storage (S3/R2) via a release `externalUrl` instead.
    disk:
      name: dijipeople-storage
      mountPath: /var/data
      sizeGB: 5
    envVars:
      # Absolute path on the persistent disk above. StorageService resolves
      # relative paths against cwd; an absolute path pins it to the disk.
      - key: FILE_STORAGE_DIR
        value: /var/data/storage
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # The connection migrations run over, and it must be Neon's DIRECT
      # endpoint — the hostname WITHOUT the `-pooler` infix. `prisma migrate
      # deploy` serialises migrators with a session-scoped advisory lock, and
      # the pooled endpoint is PgBouncer in transaction pooling mode, which
      # cannot hold one across statements. With DATABASE_URL pooled and this
      # unset, preDeployCommand fails on P1002 after ten seconds and the deploy
      # never reaches seeding or legal publication. BUG-0086.
      #
      # Optional everywhere there is no pooler: unset, migrations fall back to
      # DATABASE_URL.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: LANDING_APP_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_DOMAIN
        sync: false
      # Workspace routing. These decide which tenant a hostname resolves to and
      # must match the values set on apps/web and apps/admin — a deployment
      # where the API and the web proxy disagree about the base domain routes
      # requests to nothing. See
      # docs/architecture/workspace-routing-and-domains.md.
      - key: PLATFORM_ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_DOMAIN
        sync: false
      - key: TENANT_BASE_DOMAIN
        sync: false
      # Render terminates TLS in front of the service, so the browser's
      # hostname arrives in X-Forwarded-Host. Only set this where a proxy is
      # genuinely in front: on a directly reachable API it would let any caller
      # name any workspace.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Required in production: SecretEncryptionService refuses to start
      # without it rather than storing integration credentials in plaintext.
      # Set the value in the Render dashboard; never commit it.
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      # Bootstrap credentials for the platform super admin.
      #
      # These were required by `preDeployCommand` and undeclared here, which
      # meant the first deploy of a new environment aborted during
      # `npm run release` — before `seed:legal` and `legal:publish`, the steps
      # that make a purchase record consent at all. `docs/deployment/
      # environments.md` had recorded that gap; nothing in the repository
      # closed it.
      #
      # Set both for the first deploy of an environment, then REMOVE the
      # password: `seed:admin` is a no-op once an active super admin exists, so
      # a password no longer has to live in this dashboard to keep deploys
      # green. It will not overwrite an existing admin's credential.
      - key: PLATFORM_SUPER_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_SUPER_ADMIN_PASSWORD
        sync: false
      # Break-glass only. Set to "true" together with the two above to
      # deliberately reset the super admin's password, role and status — for
      # example after losing access. Unset it again immediately: left on, it
      # restores the dashboard value on every subsequent deploy, which is the
      # behaviour this variable exists to make explicit rather than automatic.
      - key: PLATFORM_SUPER_ADMIN_PASSWORD_RESET
        sync: false
      # Machine credential for scripts/publish-release.mjs. Leave UNSET to keep
      # release publishing closed on this environment: ReleasePublishTokenGuard
      # fails closed, so an environment without this value cannot be published
      # to at all. Set it in the Render dashboard only when this environment is
      # meant to receive releases; never commit it.
      - key: RELEASE_PUBLISH_TOKEN
        sync: false
      # Ceiling for a single release artefact, in bytes. Separate from
      # FILE_UPLOAD_MAX_BYTES so raising it for a self-contained installer does
      # not raise the limit on tenant document uploads. Default 512 MB.
      - key: RELEASE_ARTIFACT_MAX_BYTES
        sync: false
      # The transactional outbox worker. Business state changes and the events
      # announcing them are written together regardless of this flag; what the
      # flag controls is whether THIS process also drains them. Exactly one
      # deployed service should have it true — several is safe (claims use
      # FOR UPDATE SKIP LOCKED) but none means events accumulate undelivered.
      - key: OUTBOX_WORKER_ENABLED
        value: "true"
      - key: OUTBOX_WORKER_POLL_INTERVAL_MS
        value: "5000"
      - key: OUTBOX_WORKER_BATCH_SIZE
        value: "25"
      # When exceeding purchased capacity is ordinary, warned, or stopped for a
      # human. The review thresholds exist for the import accident: 20 -> 22 is
      # hiring, 20 -> 900 overnight is a bad CSV, and billing the second one
      # silently is indefensible. Raising these makes that outcome more likely.
      - key: SEAT_OVERAGE_WARN_PERCENT
        value: "10"
      - key: SEAT_OVERAGE_REVIEW_PERCENT
        value: "100"
      - key: SEAT_OVERAGE_REVIEW_ABSOLUTE
        value: "100"
      # Who hears about a failed payment or a broken provisioning run. There is
      # deliberately NO fallback address: a hardcoded operator email works until
      # that person leaves, and then critical notifications go to a mailbox
      # nobody reads with nothing reporting that they do. Unset means the
      # lifecycle handler marks those events MANUAL_ACTION_REQUIRED and they
      # stay visible in the outbox instead of being silently marked delivered.
      - key: PLATFORM_OPS_NOTIFICATION_EMAILS
        sync: false
      # How long tenant data is kept after access ends. The value in force is
      # copied onto each TenantRetention row when it starts, so changing this
      # never shortens a window a customer was already promised.
      - key: TENANT_RETENTION_DAYS
        value: "60"
      - key: RETENTION_POLICY_VERSION
        sync: false
      # Platform and tenant email both fall back to this provider when no
      # per-tenant provider row exists. Without it resolveProvider returns null
      # in production and every outbound email fails — invitations, contract
      # signature requests, onboarding notices. Set the values in the Render
      # dashboard; never commit credentials.
      - key: EMAIL_PROVIDER
        value: SMTP
      - key: EMAIL_SMTP_HOST
        sync: false
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: EMAIL_SMTP_SECURE
        value: "false"
      - key: EMAIL_SMTP_USER
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: DijiPeople
