name: CI

# First CI pipeline for DijiPeople. Deliberately limited to checks that are
# deterministic and need no production credentials.
#
# Two rules this file exists to enforce mechanically:
#   1. CI never mutates the checkout. The repository's own `npm run lint` runs
#      `eslint --fix` in services/api, so it is NOT used here — ESLint is
#      invoked directly in check-only mode.
#   2. CI never touches a real database. Prisma needs DATABASE_URL to be set
#      because prisma.config.ts resolves the datasource eagerly, but neither
#      `generate` nor `validate` connects. A placeholder is therefore safe and
#      is used everywhere.
#
# Phase 2 candidates (e2e, gateway, electron, migration-against-ephemeral-db)
# are documented in docs/development/ci-recommendation.md.

on:
  # All branches, not just main/develop. The Integrator pushes an
  # agent/<task> branch and needs a CI result before it opens or merges
  # anything — waiting for a PR to exist would break that flow.
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # A newer push to the same ref supersedes an in-flight run. main is excluded
  # so post-merge runs are never cancelled — those are the ones a release
  # decision depends on.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Placeholder. Prisma requires the variable; it does not connect.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
  NODE_VERSION: '22.x'

jobs:
  validate:
    name: Framework validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # No dependencies needed — these are pure repository-structure checks and
      # the fastest signal that something is structurally wrong.
      - name: Validate agent framework
        run: node scripts/validate-framework.mjs

      # The generated indexes must agree with the records they summarise. Each is
      # its own step so a red build names the system that drifted rather than
      # reporting "framework validation failed" and leaving somebody to bisect it.
      - name: Backlog records and indexes
        run: node scripts/rebuild-backlog.mjs --check
      - name: Parent task records and indexes
        run: node scripts/rebuild-tasks.mjs --check
      - name: Session records and indexes
        run: node scripts/rebuild-sessions.mjs --check
      - name: QA plans, scenarios and coverage matrix
        run: node scripts/rebuild-qa.mjs --check
      - name: Dashboards and the Engineering Control Center
        run: node scripts/generate-dashboards.mjs --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - run: npm run typecheck

  lint:
    name: Lint (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        # ESLint's type-aware rules resolve @prisma/client types.
        run: npm run prisma:generate
      # services/api IS linted here, as a required step — see the note above the
      # "ESLint — services/api" step below. This comment previously said the
      # opposite and pointed at the lint-api-report job, which was promoted away
      # on 2026-08-17; it contradicted the note 10 lines further down.
      - name: ESLint — apps/web
        working-directory: apps/web
        run: npx eslint
      - name: ESLint — apps/admin
        working-directory: apps/admin
        run: npx eslint
      - name: ESLint — apps/landing
        working-directory: apps/landing
        run: npx eslint
      # services/api joined the required gate on 2026-08-17. It had been
      # report-only because of a real error baseline — 2 errors when this
      # pipeline was written, 15 by the time it was measured again, since a
      # non-blocking job does not stop new ones arriving. All 15 are fixed:
      # 11 prettier, 3 unbound-method, 1 no-regex-spaces.
      #
      # --max-warnings=10000 against ~910 actual warnings. That is a ceiling
      # against a flood, not a target; the burn-down is ITEM-0042. Warnings do
      # not gate, errors do.
      - name: ESLint — services/api
        working-directory: services/api
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=10000
      - name: Fail if lint modified the checkout
        # Defence in depth: if any lint step ever regains --fix, this catches it
        # rather than letting CI silently "pass" against rewritten files.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Lint modified tracked files. CI must never mutate the checkout."
            git --no-pager diff --stat
            exit 1
          fi

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: API unit tests
        # Runs the whole suite, dual-permission wiring invariant included.
        #
        # That invariant used to be excluded here by NAME while a separate
        # report-only job carried its baseline. WP-03 took the baseline from 796
        # violations to 0, so on 2026-08-17 the exclusion and the report-only
        # job were both removed and the invariant gates like every other test.
        #
        # A failure here is now a real regression: a route went in behind
        # PermissionsGuard declaring only one of the two permission families.
        # Fix the route. Do not reintroduce the exclusion — restoring it would
        # re-open BUG-0049, which is exactly how the baseline reached 796.
        run: npm --workspace api run test

  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm --workspace web run test

  test-admin:
    name: Admin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm --workspace admin run test

  test-landing:
    name: Landing tests
    runs-on: ubuntu-latest
    # The public site had no test coverage until Wave 2, which is how a
    # country-to-currency table (BUG-0028) and a "Popular" badge decided by
    # array position both shipped. The suite covers the rules that decide what
    # a customer is quoted and where a buy button leads, so it gates.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm --workspace landing run test

  test-runtime:
    name: Runtime schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Platform runtime schema contract
        # Guards sensitive/system-managed fields from becoming writable or
        # exportable. Cheap, and a real security contract.
        run: npm run test:runtime-schema
      - name: Workspace hostname rules
        # The hostname parser decides which tenant a request belongs to. These
        # are the suffix-confusion and reserved-label cases that would otherwise
        # hand one customer another customer's workspace.
        run: npm run test:platform-domains
      - name: Release publisher rules
        # Version reconciliation and the production confirmation rule. Both
        # decide what reaches customers, and neither is exercised by any other
        # suite, so a break here would otherwise only surface during a release.
        run: npm run test:release-cli
      - name: Cross-app URL rules
        # The public "Login" button shipped pointing at http://localhost:3001
        # because nothing required NEXT_PUBLIC_WEB_APP_URL and the call site
        # carried its own loopback fallback. These assert that a production
        # build now fails on a missing, malformed or loopback app URL.
        run: npm run test:app-urls
      - name: No loopback URLs in shipped source
        # The other half of the same defect: a hardcoded literal never consults
        # an environment variable, so environment validation cannot see it.
        run: npm run check:no-hardcoded-urls
      - name: Proxy route handlers forward the client IP
        # BUG-0032. Every public form is proxied by a Next route handler, so a
        # handler that does not carry the visitor's address forward silently
        # collapses the whole world into one rate limit bucket. The feature
        # still works, which is why this needs a machine to notice.
        run: npm run check:proxy-forwards-client-ip
      - name: No native prompts for governed input
        # BUG-0020. A window.prompt collecting a reason that lands in an audited
        # record is unlabelled, unvalidated and untestable. The allowlist counts
        # the known remaining call sites (ITEM-0031) so the debt stays visible.
        run: npm run check:no-native-prompt
      - name: No country-derived currency in frontend source
        # BUG-0028 was a country-to-currency table compiled into the landing
        # bundle. The frontend renders what the API resolved from Market
        # configuration; it never decides. A comment is not a gate (ITEM-0021).
        run: npm run check:no-commercial-literals
      - name: Callers and routes agree on HTTP method
        # BUG-0008 and BUG-0038 — each side individually correct, the pair
        # wrong, and nothing comparing pairs. A link is always a GET
        # (ITEM-0012).
        run: npm run check:route-method-callers
      - name: Proxies forward refusals
        # BUG-0039 — two proxies converted a 403 into a 200 carrying a
        # different employee's payslips and bank accounts. A proxy makes no
        # authorization decisions.
        run: npm run check:proxies-forward-refusals
      - name: Security response headers
        # BUG-0040 — all three Next apps shipped none. Pins that the CSP stays
        # report-only until observed, and that frame protection is not deferred
        # with it.
        run: npm run test:security-headers

  database-migration:
    name: Database migration gate
    runs-on: ubuntu-latest
    # THE database gate. Proves the committed migration history applies to an
    # empty PostgreSQL and reaches the expected schema, then that the
    # production-safe seed configuration applies and verifies.
    #
    # Why this deserves its own job: a developer's database already holds the
    # schema, so a broken migration history still "works" locally. Only applying
    # the whole history to nothing tests the history itself.
    services:
      postgres:
        # Ephemeral by construction: created for this job, destroyed with the
        # runner. Nothing persists, so no cleanup step can be forgotten.
        image: postgres:16-alpine
        env:
          # Synthetic throwaway credentials, deliberately NOT repository secrets
          # — storing them as secrets would imply they protect something.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dijipeople_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dijipeople_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Overrides the workflow-level placeholder. Localhost, and named so
      # scripts/assert-test-database.mjs recognises it as disposable.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Refuse to run against a non-disposable database
        # Runs before anything destructive. Allowlist-shaped, so an unrecognised
        # host fails closed rather than open.
        run: node scripts/assert-test-database.mjs
      - name: Migrate an empty database and verify the seed configuration
        # generate -> migrate deploy -> migrate status -> seed:config -> seed:verify
        # Never `migrate dev`: it is interactive, can author new migrations, and
        # can reset the database.
        run: node scripts/verify-database.mjs

      - name: Commercial bootstrap and PlanPrice uniqueness (real PostgreSQL)
        # BUG-0030 was a disagreement between an application-level existence
        # check and a PARTIAL UNIQUE INDEX, plus a check-then-create race. A
        # mocked Prisma cannot see either — which is how it reached production.
        #
        # Promoted into this gate rather than left in the report-only e2e job,
        # because the whole fix rests on constraint behaviour that only a real
        # database demonstrates. Scoped to one spec so it does not inherit the
        # wider e2e suite's known flakiness.
        run: >
          npm --workspace api run test:e2e --
          --testPathPatterns "commercial-bootstrap"

  database-e2e-report:
    name: Database e2e (report only — NOT a gate)
    runs-on: ubuntu-latest
    needs: [database-migration]
    # All 15 e2e suites now execute in CI against a fresh database. At the
    # initial 2026-08-17 discovery baseline, 9 suites / 91 tests passed and 6
    # suites / 136 tests failed; WP-02 exact-SHA evidence later worsened to 8/79
    # passing and 7/148 failing. Requiring the whole set before that inventory
    # is burned down would make every unrelated change red.
    #
    # REMAINING PROMOTION CRITERIA — remove `continue-on-error` and rely on
    # this job as a truthful gate when all hold:
    #   1. Every suite classified READY passes three consecutive runs.
    #   2. Suites needing fixtures or environment are fixed, or quarantined by
    #      name with the reason recorded in docs/qa/.
    #   3. Total runtime stays under ~10 minutes.
    # Classification: docs/qa/test-strategy/e2e-suite-classification.md
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dijipeople_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dijipeople_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A DIFFERENT database name from the migration job. Service containers are
      # per-job so they cannot collide today, but naming them apart makes a
      # future change that shares one service obvious rather than silent.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_e2e_test
      NODE_ENV: test
      # Synthetic, test-only, deliberately not a repository secret. Without it
      # SecretEncryptionService warns and stores integration credentials in
      # plaintext (it only throws in production), so the three integration
      # suites would exercise a path that never runs in a real environment.
      SECRET_ENCRYPTION_KEY: ci-test-only-encryption-key-not-a-secret-000000
      # Booting AppModule constructs StripeBillingService, which throws unless
      # all three are present — the first CI run failed every AppModule-based
      # suite on "STRIPE_SECRET_KEY is required for Stripe billing."
      #
      # These are fake and unusable: no test makes a Stripe call. The key must
      # still start with `sk_test_`, because assertSecretMatchesMode rejects a
      # non-test key when STRIPE_MODE=test — a guard worth keeping honest even
      # in CI.
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_API_VERSION: '2024-06-20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: node scripts/assert-test-database.mjs
      - name: Prepare the database
        run: node scripts/verify-database.mjs
      - name: Seed demo data
        # `permission-propagation` and `platform-workflows` call
        # `customerAccount.findFirstOrThrow()` — a Tenant cannot exist without a
        # CustomerAccount (required FK, onDelete: Restrict), and seed:config does
        # not create one. seed:demo does.
        #
        # This is the one pre-existing-data dependency in the suite set. Tests
        # written from here on should build their own via test/helpers/db-fixtures.ts
        # rather than growing this dependency.
        run: npm --workspace api run seed:demo
      - name: Run database-backed e2e suites
        id: e2e
        run: |
          set +e
          npm --workspace api run test:e2e 2>&1 | tee e2e-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Summarise
        if: always()
        # BUG-0049 — this job stays non-gating, but its RESULT line must say what
        # actually happened. Previously the summary printed the counts and left
        # the reader to infer, while the job concluded success; a QA run then
        # copied "all jobs green" from the conclusion and recorded a pass over
        # 136 failed tests. A report-only job is evidence, and evidence that
        # rounds itself up is worse than no job at all.
        run: |
          code='${{ steps.e2e.outputs.exit_code }}'
          if [ "$code" = "0" ]; then result='PASS'; else result="FAIL (jest exit $code)"; fi
          {
            echo "### Database e2e — baseline report"
            echo ""
            echo "RESULT: $result"
            echo ""
            echo "Non-blocking, and NOT a gate. Do not read this job's green"
            echo "conclusion as a pass — read the RESULT line above."
            echo ""
            echo '```'
            grep -E "Tests:|Test Suites:|✕|Cannot find|timeout" e2e-report.txt | head -60 || echo "no summary lines found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ]; then
            echo "::warning title=Database e2e failed::Non-gating, but this run is RED — jest exited $code. Do not record it as a pass."
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-e2e-report
          path: e2e-report.txt
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    # Slowest job. Gated behind the fast signals so an obvious break fails in
    # ~2 minutes instead of ~10.
    needs: [typecheck, test-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Monorepo build
        run: npm run build

  # lint-api-report was PROMOTED on 2026-08-17 and no longer exists.
  #
  # Its error baseline is zero, so it now runs as a required step inside the
  # `lint` job. Keeping a duplicate report-only copy would double the runtime and
  # report the same result twice.
  #
  # The promotion path it documented — "fix those two errors, then move this step
  # into the required lint job" — was followed exactly, three days and thirteen
  # extra errors later. That gap is the argument for exit criteria: a report-only
  # job does not hold a baseline still, it only stops anyone noticing it grow.

  # security-invariant-report was PROMOTED on 2026-08-17 and no longer exists.
  #
  # Its four promotion criteria were all met: WP-03 took the dual-permission
  # inventory from 796 violations to 0, the API suite passes without the
  # --testNamePattern exclusion, develop went green twice consecutively, and
  # ITEM-0043 tracked the count throughout. The invariant now runs inside the
  # required "test-api" job, so a duplicate report-only copy would double the
  # runtime and report the same result twice.
  #
  # It is also the job BUG-0049 was filed against. It read jest's status from
  # "$?" after a "| tee" pipeline, which is tee's status and therefore always 0,
  # so the job concluded success while its own report showed 796 violations.
  # Promotion removes that false green rather than repairing it: a required job
  # cannot round its own result up.

  browser-e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    # The first browser coverage this repository has ever had. Until this job,
    # `BROWSER_E2E = BLOCKED_INFRASTRUCTURE` appeared in every QA run and no UI
    # defect could be *proven* fixed — see ITEM-0001 and
    # docs/development/browser-e2e.md.
    #
    # PROMOTED to a required gate on 2026-08-17. It had been report-only because
    # three servers, a seeded database, browser binaries and a real login is more
    # environmental surface than any other gate carries.
    #
    # The criteria below were written before this task and were met, not adjusted
    # to fit:
    #   1. three consecutive green runs, zero retries consumed — runs
    #      32006245507, 32006831300, 32007388682, each "8 passed" with no
    #      retry line;
    #   2. runtime ~6 min wall clock, ~1 min in tests — under the ~8 min bar;
    #   3. startup polls each URL with `curl -sf` until it answers, rather than
    #      sleeping a fixed interval;
    #   4. the one environment-dependent scenario is quarantined BY NAME —
    #      B4, `test.fixme` with BUG-0019 recorded in the test itself.
    #
    # It earned this by finding a real defect the moment it could run: BUG-0048,
    # an optional field that made the public partner inquiry form unsubmittable.
    #
    # If it proves flaky in practice, move it back to report-only WITH the
    # failing evidence — not silently, and not by deleting a scenario.
    #
    # The job is already listed in `ci-required.needs`. Its remaining defect is
    # `continue-on-error: true`, which makes that promotion fail-open. Remove
    # the flag once the named BUG-0019 skip is replaced by a passing assertion;
    # until then the required aggregate is not proof that every browser case ran.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dijipeople_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dijipeople_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_browser_test
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_browser_test
      NODE_ENV: test
      SECRET_ENCRYPTION_KEY: ci-test-only-encryption-key-not-a-secret-000000
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_API_VERSION: '2024-06-20'
      # Synthetic and disposable: the database is destroyed with the runner and
      # holds nothing. Deliberately NOT a repository secret — storing it as one
      # would imply it protects something.
      PLATFORM_SUPER_ADMIN_EMAIL: e2e-admin@dijipeople.test
      PLATFORM_SUPER_ADMIN_PASSWORD: ci-browser-e2e-only-not-a-secret
      E2E_PLATFORM_ADMIN_EMAIL: e2e-admin@dijipeople.test
      E2E_PLATFORM_ADMIN_PASSWORD: ci-browser-e2e-only-not-a-secret
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      API_BASE_URL: http://localhost:4000/api
      API_ORIGIN: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: node scripts/assert-test-database.mjs
      - name: Prepare the database
        run: node scripts/verify-database.mjs
      - name: Seed demo data and a platform operator
        run: |
          npm --workspace api run seed:demo
          npm --workspace api run seed:admin
      - name: Install the browser
        run: npm run test:browser:install
      - name: Start the API, landing and admin
        # Backgrounded with logs to files. The readiness loop is what makes this
        # deterministic — a fixed sleep would be exactly the flakiness this job
        # must not have if it is ever to become a gate.
        run: |
          npm run dev:api      > api.log     2>&1 &
          npm run dev:landing  > landing.log 2>&1 &
          npm run dev:admin    > admin.log   2>&1 &
          for url in http://localhost:4000/api/health http://localhost:3000 http://localhost:3002/login; do
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null "$url"; then echo "ready: $url"; break; fi
              if [ "$i" = "60" ]; then echo "::warning::$url never became ready"; fi
              sleep 5
            done
          done
      - name: Run the browser journeys
        run: npm run test:browser
      - name: Upload the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            landing.log
            admin.log
          retention-days: 30

  ci-required:
    name: CI required gate
    runs-on: ubuntu-latest
    # Single aggregate status the Integrator and branch protection can key on,
    # so adding a job later does not require reconfiguring the merge policy.
    # security-invariant-report and database-e2e-report are deliberately absent
    # from `needs` — both are still report-only, each with written promotion
    # criteria (ITEM-0043 carries the security one).
    #
    # browser-e2e joined on 2026-08-17 after meeting the criteria recorded on the
    # job itself. lint now covers services/api too, so `Lint services/api` is a
    # required step rather than a separate report-only job.
    needs:
      [validate, typecheck, lint, test-api, test-web, test-admin, test-landing, test-runtime, database-migration, build, browser-e2e]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Required job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r). Merge is blocked."
              exit 1
            fi
          done
          echo "All required jobs passed."
