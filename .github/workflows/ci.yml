name: CI

# First CI pipeline for DijiPeople. Deliberately limited to checks that are
# deterministic and need no production credentials.
#
# Two rules this file exists to enforce mechanically:
#   1. CI never mutates the checkout. The repository's own `npm run lint` runs
#      `eslint --fix` in services/api, so it is NOT used here — ESLint is
#      invoked directly in check-only mode.
#   2. CI never touches a real database. Prisma needs DATABASE_URL to be set
#      because prisma.config.ts resolves the datasource eagerly, but neither
#      `generate` nor `validate` connects. A placeholder is therefore safe and
#      is used everywhere.
#
# Phase 2 candidates (e2e, gateway, electron, migration-against-ephemeral-db)
# are documented in docs/development/ci-recommendation.md.

on:
  # All branches, not just main/develop. The Integrator pushes an
  # agent/<task> branch and needs a CI result before it opens or merges
  # anything — waiting for a PR to exist would break that flow.
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # A newer push to the same ref supersedes an in-flight run. main is excluded
  # so post-merge runs are never cancelled — those are the ones a release
  # decision depends on.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Placeholder. Prisma requires the variable; it does not connect.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
  NODE_VERSION: '22.x'

jobs:
  validate:
    name: Framework validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # No dependencies needed — this job is pure repository-structure checks
      # and is the fastest signal that something is structurally wrong.
      - name: Validate agent framework
        run: node scripts/validate-framework.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - run: npm run typecheck

  lint:
    name: Lint (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        # ESLint's type-aware rules resolve @prisma/client types.
        run: npm run prisma:generate
      # services/api is NOT linted here — it carries 2 pre-existing errors on
      # main and runs in the non-blocking lint-api-report job instead. See that
      # job for the promotion path.
      - name: ESLint — apps/web
        working-directory: apps/web
        run: npx eslint
      - name: ESLint — apps/admin
        working-directory: apps/admin
        run: npx eslint
      - name: ESLint — apps/landing
        working-directory: apps/landing
        run: npx eslint
      - name: Fail if lint modified the checkout
        # Defence in depth: if any lint step ever regains --fix, this catches it
        # rather than letting CI silently "pass" against rewritten files.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Lint modified tracked files. CI must never mutate the checkout."
            git --no-pager diff --stat
            exit 1
          fi

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: API unit tests
        # Excludes exactly one test by NAME — the dual-permission wiring
        # invariant, a known baseline failure reported by the non-blocking job
        # below.
        #
        # Excluding it by *path* would have been easier and wrong: the same file
        # holds four other wiring invariants that currently pass (permissions
        # granted to a role, settings menu wiring, filter operators). Dropping
        # the file would silently stop gating those too. The negative lookahead
        # keeps all four in this required gate.
        run: >
          npm --workspace api run test --
          --testNamePattern "^(?!.*declares both permission systems).*$"

  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm --workspace web run test

  test-admin:
    name: Admin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm --workspace admin run test

  test-runtime:
    name: Runtime schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Platform runtime schema contract
        # Guards sensitive/system-managed fields from becoming writable or
        # exportable. Cheap, and a real security contract.
        run: npm run test:runtime-schema
      - name: Workspace hostname rules
        # The hostname parser decides which tenant a request belongs to. These
        # are the suffix-confusion and reserved-label cases that would otherwise
        # hand one customer another customer's workspace.
        run: npm run test:platform-domains
      - name: Release publisher rules
        # Version reconciliation and the production confirmation rule. Both
        # decide what reaches customers, and neither is exercised by any other
        # suite, so a break here would otherwise only surface during a release.
        run: npm run test:release-cli

  database-migration:
    name: Database migration gate
    runs-on: ubuntu-latest
    # THE database gate. Proves the committed migration history applies to an
    # empty PostgreSQL and reaches the expected schema, then that the
    # production-safe seed configuration applies and verifies.
    #
    # Why this deserves its own job: a developer's database already holds the
    # schema, so a broken migration history still "works" locally. Only applying
    # the whole history to nothing tests the history itself.
    services:
      postgres:
        # Ephemeral by construction: created for this job, destroyed with the
        # runner. Nothing persists, so no cleanup step can be forgotten.
        image: postgres:16-alpine
        env:
          # Synthetic throwaway credentials, deliberately NOT repository secrets
          # — storing them as secrets would imply they protect something.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dijipeople_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dijipeople_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Overrides the workflow-level placeholder. Localhost, and named so
      # scripts/assert-test-database.mjs recognises it as disposable.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Refuse to run against a non-disposable database
        # Runs before anything destructive. Allowlist-shaped, so an unrecognised
        # host fails closed rather than open.
        run: node scripts/assert-test-database.mjs
      - name: Migrate an empty database and verify the seed configuration
        # generate -> migrate deploy -> migrate status -> seed:config -> seed:verify
        # Never `migrate dev`: it is interactive, can author new migrations, and
        # can reset the database.
        run: node scripts/verify-database.mjs

  database-e2e-report:
    name: Database e2e (report only — NOT a gate)
    runs-on: ubuntu-latest
    needs: [database-migration]
    # The 9 e2e suites have never run in CI and have not been observed passing
    # against a fresh database. Requiring them on arrival risks a permanently
    # red gate, which trains people to ignore CI — the exact failure the
    # pipeline exists to prevent.
    #
    # PROMOTION CRITERIA — move into `ci-required` when all hold:
    #   1. Every suite classified READY passes three consecutive runs.
    #   2. Suites needing fixtures or environment are fixed, or quarantined by
    #      name with the reason recorded in docs/qa/.
    #   3. Total runtime stays under ~10 minutes.
    # Classification: docs/qa/test-strategy/e2e-suite-classification.md
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dijipeople_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dijipeople_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A DIFFERENT database name from the migration job. Service containers are
      # per-job so they cannot collide today, but naming them apart makes a
      # future change that shares one service obvious rather than silent.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_e2e_test
      NODE_ENV: test
      # Synthetic, test-only, deliberately not a repository secret. Without it
      # SecretEncryptionService warns and stores integration credentials in
      # plaintext (it only throws in production), so the three integration
      # suites would exercise a path that never runs in a real environment.
      SECRET_ENCRYPTION_KEY: ci-test-only-encryption-key-not-a-secret-000000
      # Booting AppModule constructs StripeBillingService, which throws unless
      # all three are present — the first CI run failed every AppModule-based
      # suite on "STRIPE_SECRET_KEY is required for Stripe billing."
      #
      # These are fake and unusable: no test makes a Stripe call. The key must
      # still start with `sk_test_`, because assertSecretMatchesMode rejects a
      # non-test key when STRIPE_MODE=test — a guard worth keeping honest even
      # in CI.
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_API_VERSION: '2024-06-20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: node scripts/assert-test-database.mjs
      - name: Prepare the database
        run: node scripts/verify-database.mjs
      - name: Seed demo data
        # `permission-propagation` and `platform-workflows` call
        # `customerAccount.findFirstOrThrow()` — a Tenant cannot exist without a
        # CustomerAccount (required FK, onDelete: Restrict), and seed:config does
        # not create one. seed:demo does.
        #
        # This is the one pre-existing-data dependency in the suite set. Tests
        # written from here on should build their own via test/helpers/db-fixtures.ts
        # rather than growing this dependency.
        run: npm --workspace api run seed:demo
      - name: Run database-backed e2e suites
        id: e2e
        run: |
          set +e
          npm --workspace api run test:e2e 2>&1 | tee e2e-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Summarise
        if: always()
        run: |
          {
            echo "### Database e2e — baseline report"
            echo ""
            echo "Non-blocking. Promoted per the criteria in this workflow."
            echo ""
            echo '```'
            grep -E "Tests:|Test Suites:|✕|Cannot find|timeout" e2e-report.txt | head -60 || echo "no summary lines found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-e2e-report
          path: e2e-report.txt
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    # Slowest job. Gated behind the fast signals so an obvious break fails in
    # ~2 minutes instead of ~10.
    needs: [typecheck, test-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Monorepo build
        run: npm run build

  lint-api-report:
    name: Lint services/api (report only — NOT a gate)
    runs-on: ubuntu-latest
    # services/api has 2 pre-existing ESLint errors on main, both
    # @typescript-eslint/unbound-method in
    # src/modules/auth/auth.service.spec.ts (lines 120 and 125), alongside ~815
    # warnings.
    #
    # Gating on it today would make CI red on arrival for reasons unrelated to
    # any incoming change, which trains people to ignore or bypass it.
    #
    # Promotion path: fix those two errors, then move this step into the
    # required `lint` job. The rule is not disabled and nothing is suppressed —
    # the check runs in full here every time.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: ESLint — services/api (check only, never --fix)
        working-directory: services/api
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=10000

  security-invariant-report:
    name: Security invariant (report only — NOT a gate)
    runs-on: ubuntu-latest
    # Runs the dual-permission wiring invariant and reports its inventory
    # WITHOUT blocking the pipeline.
    #
    # Why it does not gate: the invariant currently fails against a large,
    # pre-existing inventory of handlers declaring only one of the two
    # permission families. Gating on it would block every unrelated PR on
    # accumulated debt, which trains people to bypass CI.
    #
    # The invariant is NOT weakened, skipped or edited. It runs in full here,
    # its output is uploaded, and the intent is to promote this job to a
    # required gate once the inventory reaches zero. Progress is tracked in
    # docs/qa/regressions/index.md and docs/development/ci-recommendation.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Dual-permission wiring invariant
        id: invariant
        run: |
          set +e
          npm --workspace api run test -- --testPathPatterns "wiring-invariants" 2>&1 | tee invariant-report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Summarise inventory
        if: always()
        run: |
          {
            echo "### Dual-permission invariant — baseline report"
            echo ""
            echo "Non-blocking. Promoted to a required gate when violations reach 0."
            echo ""
            echo '```'
            grep -E "total route handlers|public handlers|not behind|in scope|compliant|violations|missing @" invariant-report.txt || echo "inventory not found in output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-invariant-report
          path: invariant-report.txt
          retention-days: 30

  browser-e2e-report:
    name: Browser e2e (report only — NOT a gate)
    runs-on: ubuntu-latest
    # The first browser coverage this repository has ever had. Until this job,
    # `BROWSER_E2E = BLOCKED_INFRASTRUCTURE` appeared in every QA run and no UI
    # defect could be *proven* fixed — see ITEM-0001 and
    # docs/development/browser-e2e.md.
    #
    # Report-only for the same reason database-e2e-report is: three servers, a
    # seeded database, browser binaries and a real login is strictly more
    # environmental surface than any existing gate carries. A gate that is red
    # on arrival for environmental reasons trains people to ignore CI.
    #
    # PROMOTION CRITERIA — move into `ci-required` when all hold:
    #   1. Three consecutive green runs on main with zero retries consumed.
    #   2. Total runtime under ~8 minutes.
    #   3. Server startup is deterministic — no sleep-and-hope waits.
    #   4. Any environment-dependent scenario is quarantined BY NAME with the
    #      reason recorded in docs/qa/.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dijipeople_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dijipeople_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_browser_test
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/dijipeople_browser_test
      NODE_ENV: test
      SECRET_ENCRYPTION_KEY: ci-test-only-encryption-key-not-a-secret-000000
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_API_VERSION: '2024-06-20'
      # Synthetic and disposable: the database is destroyed with the runner and
      # holds nothing. Deliberately NOT a repository secret — storing it as one
      # would imply it protects something.
      PLATFORM_SUPER_ADMIN_EMAIL: e2e-admin@dijipeople.test
      PLATFORM_SUPER_ADMIN_PASSWORD: ci-browser-e2e-only-not-a-secret
      E2E_PLATFORM_ADMIN_EMAIL: e2e-admin@dijipeople.test
      E2E_PLATFORM_ADMIN_PASSWORD: ci-browser-e2e-only-not-a-secret
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      API_BASE_URL: http://localhost:4000/api
      API_ORIGIN: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: node scripts/assert-test-database.mjs
      - name: Prepare the database
        run: node scripts/verify-database.mjs
      - name: Seed demo data and a platform operator
        run: |
          npm --workspace api run seed:demo
          npm --workspace api run seed:admin
      - name: Install the browser
        run: npm run test:browser:install
      - name: Start the API, landing and admin
        # Backgrounded with logs to files. The readiness loop is what makes this
        # deterministic — a fixed sleep would be exactly the flakiness this job
        # must not have if it is ever to become a gate.
        run: |
          npm run dev:api      > api.log     2>&1 &
          npm run dev:landing  > landing.log 2>&1 &
          npm run dev:admin    > admin.log   2>&1 &
          for url in http://localhost:4000/api/health http://localhost:3000 http://localhost:3002/login; do
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null "$url"; then echo "ready: $url"; break; fi
              if [ "$i" = "60" ]; then echo "::warning::$url never became ready"; fi
              sleep 5
            done
          done
      - name: Run the browser journeys
        run: npm run test:browser
      - name: Upload the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            landing.log
            admin.log
          retention-days: 30

  ci-required:
    name: CI required gate
    runs-on: ubuntu-latest
    # Single aggregate status the Integrator and branch protection can key on,
    # so adding a job later does not require reconfiguring the merge policy.
    # security-invariant-report is deliberately absent from `needs`.
    needs:
      [validate, typecheck, lint, test-api, test-web, test-admin, test-runtime, database-migration, build]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Required job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r). Merge is blocked."
              exit 1
            fi
          done
          echo "All required jobs passed."
